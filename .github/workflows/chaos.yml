name: Chaos Engineering
on:
  schedule:
    - cron: "0 4 * * 0"  # weekly
jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
      - run: pytest tests/chaos/ -v --chaos
      - uses: slackapi/slack-github-action@v1
        if: failure()
        with:
          payload: '{"text": "🔥 Chaos test failed! Check logs."}'
