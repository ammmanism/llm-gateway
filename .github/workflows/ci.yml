name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies & Linters
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install bandit
        
    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=github
        
    - name: Type checking with mypy
      run: |
        mypy . --ignore-missing-imports || true
        
    - name: Security scan with Bandit
      run: |
        bandit -r . -c pyproject.toml || true

  test:
    name: Integration & Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
        
    - name: Run Test Suite
      env:
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/ -v --junitxml=test-results.xml --ignore=tests/modality --ignore=tests/cache

  benchmark:
    name: Performance Regression
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    - name: Run Benchmarks
      run: |
        python benchmarks/run_all.py
    - name: Compare with baseline
      run: |
        python -c "
import json, sys
baseline_path = 'benchmarks/results/cache_comparison.json'
with open(baseline_path) as f:
    data = json.load(f)
hits = data.get('semantic_cache', {}).get('hit_rate', 0)
if hits < 0.01:
    print(f'FAIL: semantic hit rate {hits:.1%} below 1% threshold')
    sys.exit(1)
else:
    print(f'OK: semantic hit rate {hits:.1%}')
"

  build:
    name: Docker Image Build Test
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Gateway Image
      run: |
        docker build -t llm-gateway:v${{ github.run_number }} -f Dockerfile .
