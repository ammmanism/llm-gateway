name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies & Linters
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install bandit
        
    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .
        
    - name: Type checking with mypy
      run: |
        mypy . --ignore-missing-imports || true
        
    - name: Security scan with Bandit
      run: |
        bandit -r . -c pyproject.toml || true

  test:
    name: Integration & Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
        
    - name: Run Test Suite
      env:
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/ -v --cov=llm_gateway --cov-branch \
          --cov-report=term-missing --cov-report=xml:coverage.xml \
          --cov-report=json:coverage.json --cov-report=html:htmlcov \
          --junitxml=test-results.xml
        python benchmarks/coverage_summary.py \
          --input coverage.json --output coverage_summary.csv

    - name: Upload coverage and test reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-and-test-reports
        path: |
          coverage.xml
          coverage_summary.csv
          htmlcov/
          test-results.xml

  benchmark:
    name: Evidence Generation
    needs: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    - name: Run evidence generators
      env:
        REDIS_URL: redis://localhost:6379/0
        OTEL_SDK_DISABLED: "true"
      run: |
        python benchmarks/run_all.py

  build:
    name: Docker Image Build Test
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Gateway Image
      run: |
        docker build -t llm-gateway:v${{ github.run_number }} -f Dockerfile .
