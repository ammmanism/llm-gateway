apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurocache
  labels:
    app: neurocache
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neurocache
  template:
    metadata:
      labels:
        app: neurocache
    spec:
      containers:
      - name: neurocache
        image: neurocache:latest # Replace with your registry
        ports:
        - containerPort: 8000
        env:
        - name: ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: neurocache-secrets
              key: REDIS_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neurocache-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
