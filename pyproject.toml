[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimodal"
version = "1.0.0"
description = "Unified Multimodal AI Gateway"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "OmniModal Team", email = "team@omnimodal.ai"}]
keywords = ["ai", "multimodal", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
all = ["openai>=1.14.0", "anthropic>=0.21.0", "google-generativeai>=0.4.0", "stability-sdk>=0.3.0", "replicate>=0.25.0", "elevenlabs>=1.0.0"]
dev = ["pytest>=8.1.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "black>=24.2.0", "ruff>=0.3.0", "mypy>=1.9.0", "pre-commit>=3.6.0"]

[project.scripts]
omni = "omnimodal.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=omnimodal --cov-report=term-missing"
