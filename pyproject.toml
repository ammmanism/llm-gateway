[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimodal"
version = "1.0.0"
description = "Unified Multimodal AI Gateway - One API for every modality"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OmniModal Team", email = "team@omnimodal.ai"}
]
keywords = [
    "ai", "multimodal", "llm", "gateway", "openai", "anthropic", 
    "image-generation", "text-to-speech", "video-generation", "mlops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aioredis>=2.0.1",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.14.0",
    "anthropic>=0.21.0",
    "google-generativeai>=0.4.0",
    "stability-sdk>=0.3.0",
    "replicate>=0.25.0",
    "elevenlabs>=1.0.0",
    "websockets>=12.0",
    "streamlit>=1.32.0",
    "gradio>=4.0.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.99.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
benchmark = [
    "locust>=2.24.0",
    "pyinstrument>=4.6.0",
    "memray>=1.12.0",
]

[project.scripts]
omni = "omnimodal.cli:main"

[project.urls]
Homepage = "https://github.com/ammmanism/omniModal"
Documentation = "https://docs.omnimodal.ai"
Repository = "https://github.com/ammmanism/omniModal"
Issues = "https://github.com/ammmanism/omniModal/issues"
Changelog = "https://github.com/ammmanism/omniModal/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/omnimodal"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=omnimodal --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/omnimodal"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
