[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimodal"
version = "1.0.0"
description = "Unified Multimodal AI Gateway - One API for every modality"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OmniModal Team", email = "team@omnimodal.ai"}
]
keywords = [
    "ai", "multimodal", "llm", "gateway", "openai", "anthropic", 
    "image-generation", "text-to-speech", "video-generation", "mlops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
